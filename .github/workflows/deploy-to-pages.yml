name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate shared components
        run: node scripts/build-components.js

      - name: Create public directory
        run: |
          rm -rf public
          mkdir -p public
          # Copy site files (adjust as needed)
          cp index.html public/
          cp case-*.html public/
          cp contact.html public/
          cp experiencia.html public/
          mkdir -p public/assets
          cp -R assets/. public/assets/
          mkdir -p public/styles
          cp -R styles/. public/styles/
          mkdir -p public/components
          cp -R components/. public/components/
          mkdir -p public/scripts
          cp -R scripts/. public/scripts/

      - name: Deploy to gh-pages via peaceiris
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
