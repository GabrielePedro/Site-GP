name: Check inline styles

on:
  push: {}
  pull_request: {}

jobs:
  check-inline-styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check shared component generation
        run: |
          node scripts/build-components.js
          git diff --exit-code -- '*.html'
      - name: Test design system contracts
        run: node --test
      - name: Set execute permissions for scripts
        run: |
          chmod +x ./scripts/check-inline-styles.sh
      - name: Run inline styles checker
        run: ./scripts/check-inline-styles.sh
