<div class="case-row{{reverse}}">
  <div class="case-left">
    <h3 class="case-title">{{title}}</h3>
    {{pill}}
    <p class="case-lead">{{lead}}</p>
    {{action}}
  </div>
  <div class="case-right">
    <div class="case-hero {{variant}}">
      <div class="hero-inner"><img src="{{image}}" alt="{{alt}}" loading="lazy" width="570" height="500"></div>
    </div>
  </div>
</div>
