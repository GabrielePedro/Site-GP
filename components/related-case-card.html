<article class="related-card" aria-labelledby="related-title-{{key}}">
  <a class="related-card__media case-image-link" href="{{href}}" aria-label="Conhecer projeto: {{title}}">
    <img src="{{image}}" alt="{{alt}}" width="1140" height="1000" loading="lazy">
  </a>
  <div class="related-card__body">
    <div class="related-card__copy">
      <div class="related-card__heading">
        <span class="related-card__tag">{{tag}}</span>
        <h3 id="related-title-{{key}}">{{title}}</h3>
      </div>
      <div class="related-card__teaser">
        <p class="related-card__intro">{{description}}</p>
        <p class="related-card__metric">{{metric}}</p>
      </div>
    </div>
    {{action}}
  </div>
</article>
